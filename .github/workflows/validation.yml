name: Validation

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1-5"

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, test, lint, audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Dependency audit
        run: npm audit --json

      - name: E2E test discovery
        run: npm run test:e2e:list

  production-build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: validate
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_VERCEL_URL: ${{ secrets.NEXT_PUBLIC_VERCEL_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check build secrets
        id: build-secrets
        shell: bash
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping production build because NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY secrets are not configured."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.build-secrets.outputs.available == 'true'
        run: npm run build

  authenticated-e2e:
    name: Authenticated task smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: validate
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check E2E secrets
        id: e2e-secrets
        shell: bash
        run: |
          if [ -z "$E2E_BASE_URL" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping authenticated task smoke because E2E_BASE_URL is not configured."
          elif [ -z "$E2E_EMAIL" ] || [ -z "$E2E_PASSWORD" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping authenticated task smoke because E2E_EMAIL and E2E_PASSWORD are not configured."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Chromium
        if: steps.e2e-secrets.outputs.available == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run authenticated task smoke
        if: steps.e2e-secrets.outputs.available == 'true'
        run: npm run test:e2e
